# The 40-minute shake-out of the 10m six-stage self-play run (user decisions 2 Sep 2026), run BEFORE
# `dolphin_10m_bc_stages_day.toml` because a step size measured in one regime does not transfer: the
# 20m's first day launch froze for 6 h (58/58 reverts, ~$17) on an lr/guard pair that was never measured
# in-regime, and the 5m's 1e-4 was 3.7x under target for the same reason.  This file is the day file's
# exact shape -- 96 Dolphins x nb16 (72 self-play + 24 cpu9: 85/15 by trained rows), D = 0, teacher
# KL 0.1, the six legal stages cycled over the Dolphins (16 each), evals on 30 Dolphins (5 per stage)
# vs cpu9 / MIMIC / the BC anchor -- with fast
# burn-ins, a small start + end eval and a 40-min cap, so it MEASURES: the per-update actor KL at lr
# 4e-5 (the 20m's clean rate; the guard is loose here on purpose), the 10m step time and env fps, the
# GPU peak at microbatch 64, the MIMIC eval's throughput at batch 30, and that every stage boots and
# reads back from the game (`WrongStage` faults in the env stats would say the menu helper missed).
#
# The checkpoint: Ali's family-pretraining 10m run `10m-wd-low-e129b9d4dd08`, step 106806 = 7.0 B
# target frames (51x the 20m c3's 137 M), bf16 training, context 256, action_offset_frames 1 (= our
# D = 0), muon_with_aux_adamw.  Its `resolved_config.model` is the new runtime summary (profile +
# dimensions + parameter counts), which `checkpoint.ali_model_config` maps to config.yaml's 10m profile
# (all 10 163 629 parameters load strict).  Staged at the STABLE path below; sha256
# a7f336df1aa57396ee079b41d86400905968ddc8531f1e37e8ad4d15af5e5108 -- never move it, the teacher record
# re-verifies the hash on every resume.
#   cd melee-policy-frisson-ai && .venv/bin/modal run --detach -e smash_melee_bot -m melee_rl.modal_app::train \
#       --config dolphin_10m_bc_stages_smoke --gpu --wide --wandb-mode online \
#       --checkpoint-subdir p13/10m_stages_smoke --spawn
format = "melee_rl.rl_config.v1"

[runtime]
num_steps = 100000
max_runtime_s = 2400              # 40 min: boots + 3 burn-in steps + ~6 measured PPO steps at ~250 s each
seed = 0
deterministic = true
device = "cuda"
threads = 4
save_interval_steps = 2
snapshot_interval_steps = 0

[policy]
profile = "10m"                   # config.yaml: 10.16 M params; the checkpoint's summary names this profile
init = "checkpoint"
checkpoint = "/runs/bc/frisson-melee-10m-v1-best-val.pt"   # the STABLE path (staged 2 Sep 2026)
seed = 0                          # unused with init = "checkpoint"
compute_dtype = "float32"
cache_dtype = "float32"
fast_step = true                  # P7b: the vectorised ring step

[teacher]
source = "policy"                 # clone_frozen() of the just-loaded BC weights: no second file read

[env]
type = "dolphin"

[env.dolphin]
num_envs = 96                     # 72 self + 24 cpu9 (the mix groups must sum to this)
dolphin_path = "/opt/dolphin/mainline-exiai-14.1-noleak/squashfs-root/usr/bin/dolphin-emu"
iso_path = "/iso/melee.iso"
characters = [1, 1]               # libmelee internal ids: Fox vs Fox
costumes = [0, 1]
stage = 25                        # unused while `stages` is set (kept for the config's default path)
stages = [25, 24, 18, 26, 8, 6]   # FD, BF, PS, DL, FoD, YS -- cycled over the global env index: 16 each
slippi_port = 51441               # sliced per worker: worker w's env j listens on 51441 + 6w + j
console_timeout_s = 30.0
boot_timeout_s = 300.0            # 96 boots, 6 per worker, workers in parallel
keepalive_seconds = 0.0
step_threads = 0                  # per worker: one thread per Dolphin of its group (6)
boot = "two_phase"
worker_processes = 16             # split 12 + 4 across the arms (opponent.mix_workers)
mp_start_method = "spawn"
chunk_frames = 1                  # D = 0: the slack (b-1)+(k-1) <= D forces lockstep stepping

[actor]
rollout_length = 128
context_frames = 128
delay_frames = 0                  # matches the model's action_offset_frames = 1 (no mismatch flag)
context_mode = "ring"
batch_steps = 1                   # D = 0: no pipeline (P8 stays dormant by construction)
seed = 0

[actor.reward]
damage_ratio = 0.01
nana_ratio = 0.5
ledge_grab_penalty = 0.02
stalling_penalty = 0.1
stalling_threshold = 50.0
approaching_factor = 1e-3

[opponent]
type = "mix"                      # 85/15 self-play vs cpu9 by TRAINED ROWS (user decision 2 Sep 2026)
mix = ["self*72", "cpu9*24"]      # 72 self Dolphins = 144 rows (both ports) + 24 cpu9 rows: 86 % / 14 %
mix_workers = [12, 4]             # 6 Dolphins per worker in both arms; 72 and 24 are multiples of 6 stages
seed = 1

[learner]
learning_rate = 4e-5              # the 20m's measured-clean rate; THIS SMOKE MEASURES what the 10m does with it
kl_teacher_weight = 0.1           # slippi-ai's post-training recipe; the anti-collapse mechanism
value_burnin_steps = 2            # enough to damp the value-mismatch transient; the day file uses 6
optimizer_burnin_steps = 1
microbatch_envs = 24              # must divide every arm's rows (144 and 24): 6 chunks + 1 chunk per update

[learner.returns]
reward_halflife = 4.0

[learner.ppo]
num_epochs = 2
num_batches = 16                  # slippi-ai's production regime: accumulate 16 rollouts per update
epsilon = 1e-2                    # the BC regime's measured clip window
beta = 0.0
max_mean_actor_kl = 5e-3          # loose on purpose: the smoke measures, the day file enforces

[delay]
allow_mismatch = false

[mimic]
source_dir = "/opt/mimic/source"          # the pinned checkout baked into the MIMIC image
asset_dir = "/opt/mimic/fox-master"       # model.pt + config.json + the normalisation bundle
device = "cuda"                   # MIMIC has no KV cache: it re-runs its 60-frame window every frame
temperature = 1.0                 # the released defaults of integration_mimic_vs_hal.toml [mimic]
top_k = 0
top_p = 0.0
seed = 0
player = 1                        # environment player 1 = Dolphin port 2, as in Ali's launcher

[logging]
mode = "disabled"                 # the launch passes --wandb-mode online (secret: smash-melee-wandb-secret)
entity = "frisson-labs"
project = "Faynt"
group = "rl-post-training"
job_type = "rl"
tags = [
    "ppo", "dolphin-env", "self-play", "two-port", "bc-init", "teacher-kl", "10m", "l4", "smoke",
    "wide", "ring", "mp-workers", "fast-step", "nb16", "stages", "mimic-eval", "mix", "cpu9-arm", "self85",
]
print_interval_steps = 1

[eval]
enabled = true
interval_seconds = 86400.0        # never inside the 40-min cap: only the start and end rounds run
at_start = true                   # the baseline of the BC policy on every stage, incl. the first MIMIC numbers
at_end = true                     # ... and once more after the measured PPO steps (runs AFTER the cap)
frames = 15360                    # per opponent: 30 eval Dolphins x 512 frames (8.5 s of game each)
num_envs = 30                     # 5 per stage: every stage is covered in every round
worker_processes = 10             # the eval Dolphins' own layout (3 per worker; 30 does not divide by the 16 training workers)
rollout_length = 128
opponents = ["cpu9", "mimic", "other:/runs/bc/frisson-melee-10m-v1-best-val.pt"]
temperature = 1.0
seed = 0
metric = "reward_per_frame"
metric_opponent = "other"         # best.pt selects on progress against the fixed BC anchor (zero-noise)
