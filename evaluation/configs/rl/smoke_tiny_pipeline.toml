# Two learner steps of the tiny test model through the P8 delay pipeline (D = 2, b = 2, k = 1 on the
# dummy env): the Trainer builds PipelinedRolloutWorker over AsyncEnvAdapter, runs, saves and resumes.
#   .venv/bin/python -m melee_rl.train --config configs/rl/smoke_tiny_pipeline.toml --checkpoint-dir runs/p8
# Same shapes as smoke_tiny.toml (B = 3, T = 8, C = 16, context 24, games restart every 21 frames).
# allow_mismatch: the tiny model declares action_offset_frames = 1 (D = 0); at random init the flag only
# acknowledges the declared field -- nothing trained is mismatched (P8-PLAN.md preamble).
format = "melee_rl.rl_config.v1"

[runtime]
num_steps = 2
seed = 0
deterministic = true
device = "cpu"
threads = 1
save_interval_steps = 1
snapshot_interval_steps = 2

[policy]
profile = "3m"
init = "random"
seed = 1234
compute_dtype = "float32"
cache_dtype = "float32"

[policy.model_overrides]
d_model = 32
n_layers = 2
n_heads = 4
n_kv_heads = 2
head_dim = 8
d_ff = 64
context_length = 24
encoder_hidden_size = 8
item_mlp_layers = 1
gradient_checkpointing = false

[teacher]
source = "policy"

[env]
type = "dummy"

[env.dummy]
num_envs = 3
seed = 5
game_frames = 21

[actor]
rollout_length = 8
context_frames = 16
delay_frames = 2
context_mode = "reprime"
batch_steps = 2                   # b = 2 with k = 1: slack (2 - 1) + (1 - 1) = 1 <= D = 2
seed = 7

[actor.reward]
damage_ratio = 0.01
nana_ratio = 0.5

[opponent]
type = "cpu"

[learner]
learning_rate = 1e-3
kl_teacher_weight = 0.0
value_burnin_steps = 0
optimizer_burnin_steps = 0

[learner.returns]
reward_halflife = 4.0

[learner.value]
d_model = 32
n_layers = 2
n_heads = 4
n_kv_heads = 2
head_dim = 8
d_ff = 64

[learner.ppo]
num_epochs = 2
num_batches = 2
epsilon = 1e-2
beta = 0.0
max_mean_actor_kl = 1e-4

[delay]
allow_mismatch = true             # the tiny model's action_offset_frames = 1 declares D = 0

[logging]
mode = "disabled"                 # tests never talk to W&B
entity = "frisson-labs"
project = "Faynt"
group = "rl-post-training"
job_type = "rl"
tags = ["ppo", "dummy-env", "smoke", "pipeline"]
print_interval_steps = 1
