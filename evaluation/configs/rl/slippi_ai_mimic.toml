# P27 CALIBRATION (10 Sep 2026): a released slippi-ai agent against MIMIC, and against SmashBot.
#
# The second and third anchors of the gate.  CPU 9 alone cannot settle whether a release is healthy --
# it is known to MIS-RANK agents rather than merely flatter them (P12, GOTCHAS S30) -- so the release
# also plays the two opponents every model in `RESULTS.md` is already measured against.  These arms are
# what place the new rung on the existing ladder: after P26 it reads
# SmashBot > our 10m RL 1318 > MIMIC > CPU 9, and these matches say where slippi-ai goes.
#
#   .venv/bin/modal run --detach -e smash_melee_bot -m melee_rl.modal_app::external \
#       --config slippi_ai_mimic --sides slippi_ai:fox_d21_ditto_v4,mimic \
#       --label fox-d21-ditto-v4-vs-mimic \
#       --output-dir /runs/matches/p27-calibration/fox_d21_ditto_v4_mimic --spawn
#
#   .venv/bin/modal run --detach -e smash_melee_bot -m melee_rl.modal_app::external \
#       --config slippi_ai_mimic --sides slippi_ai:fox_d21_ditto_v4,smashbot \
#       --label fox-d21-ditto-v4-vs-smashbot \
#       --output-dir /runs/matches/p27-calibration/fox_d21_ditto_v4_smashbot --spawn
#
# THE SMASHBOT ARM NEEDS ONE MORE OVERRIDE.  P26 found that libmelee 0.47.3's analog remap pushes
# SmashBot's wavedash angle into Melee's deadzone, and the fix is to opt its port out.  As the SECOND
# side it plays Dolphin port 2, so that arm must add
#       --overrides "slippi_ai.model=...,env.dolphin.legacy_analog_ports=[2]"
# and WITHOUT it the measurement is against the crippled SmashBot P25 published (14-2 vs CPU 9 instead
# of 16-0, 1.9 stocks a game of failed recoveries).  The slippi-ai side must NEVER be listed there: its
# action space is the 160-unit observation grid and the remap is the conversion that lands it exactly
# (`tests/rl/test_slippi_ai_agent.py`), so opting it out would break it the other way.

format = "melee_rl.rl_config.v1"

[runtime]
num_steps = 0                     # nothing trains in a recording job
seed = 0
deterministic = true
device = "cuda"                   # MIMIC has no KV cache; the L4 is what makes a match finish
threads = 8

[policy]
profile = "10m"                   # only a fallback; the recorded checkpoint carries its own config
init = "random"
seed = 0
compute_dtype = "float32"
cache_dtype = "float32"
fast_step = true                  # P7b: the vectorised ring step

[teacher]
source = "none"

[env]
type = "dolphin"

[env.dolphin]
num_envs = 16                     # one Dolphin per match, 16 on one stage (VideoConfig.clips overrides it)
dolphin_path = "/opt/dolphin/mainline-exiai-14.1-noleak/squashfs-root/usr/bin/dolphin-emu"
iso_path = "/iso/melee.iso"
characters = [1, 1]               # Fox vs Fox, as in Ali's benchmark launcher
costumes = [0, 1]
stage = 25                        # Final Destination, like for like with every earlier FD arm
slippi_port = 51441
console_timeout_s = 30.0
boot_timeout_s = 300.0
keepalive_seconds = 0.0
step_threads = 0
boot = "two_phase"
worker_processes = 0              # REQUIRED: SmashBot reads the raw gamestates, which only exist here
chunk_frames = 1
save_replays = true
infinite_time = false             # a REAL match -- stocks fall and the game ends
stop_timeout_s = 20.0             # SIGTERM Dolphin before Console.stop kills it (ENV.md §6.5)

[actor]
rollout_length = 128
context_frames = 0                # ring mode: no history window (the deployment path)
delay_frames = 0                  # matches action_offset_frames = 1 of the recorded checkpoints
context_mode = "ring"
batch_steps = 1
seed = 0

[actor.reward]
damage_ratio = 0.01
nana_ratio = 0.5
ledge_grab_penalty = 0.02
stalling_penalty = 0.1
stalling_threshold = 50.0
approaching_factor = 1e-3

[opponent]
type = "cpu"                      # only fixes the default player layout; the recorder builds MIMIC

[learner]
kl_teacher_weight = 0.0           # nothing trains here; without a teacher the weights must be zero
reverse_kl_teacher_weight = 0.0

[delay]
allow_mismatch = false

[logging]
mode = "disabled"                 # a recording job logs nothing

[eval]
at_start = false
at_end = false

[smashbot]
source_dir = "/opt/smashbot/source"       # the pinned GPL-3.0 checkout baked into the image
player = 1                        # environment player 1 = Dolphin port 2, as MIMIC is
seed = 0                          # SmashBot draws from the global `random`; this seeds its private stream
delay_frames = 0                  # SET FROM THE cpu9 SWEEP: --overrides smashbot.delay_frames=D
                                  # use_exi_inputs + blocking_input + online_delay = 0, so an opponent
                                  # decides on frame N and its input lands on frame N -- tighter than the
                                  # named-pipe path SmashBot was written against.  A chain that presses a
                                  # frame early to absorb that latency then lands a frame early, which is
                                  # what a missed ledgedash or Firefox looks like.
compat = true                      # the libmelee shim (melee_rl.smashbot_compat).  The
                                  # calibration A/B turns it off with
                                  # --overrides "smashbot.compat=false" to MEASURE what the
                                  # 0.41 -> 0.47 drift costs, rather than assert it.
strict = true                     # THE GATE: a raised exception stops the job rather than
                                  # becoming a neutral stick nobody notices

[slippi_ai]
model = "fox_d21_ditto_v4"        # WHICH RELEASE PLAYS.  One arm per release:
                                  #   --overrides "slippi_ai.model=gm"
                                  # gm / master / diamond are the twelve-character family and need
                                  # `character` set as well (see below).  Every name, sha256, delay and
                                  # nametag lands in the manifest beside the results.
model_dir = "/runs/external/slippi-ai"    # the staged release files on the Volume
source_dir = "/opt/slippi-ai/source"      # the pinned MIT checkout baked into the image (577965a)
player = 1                        # environment player 1 = Dolphin port 2, as MIMIC and SmashBot are
character = 0                     # 0 = "the only character this release plays" (Fox for fox_*, Falco
                                  # for falco_*).  gm / master / diamond play twelve, so they must say:
                                  #   --overrides "slippi_ai.character=1"   (1 = libmelee FOX)
name = ""                         # "" = the tag upstream itself would pick: the first of the tags the
                                  # RL run conditioned on ("Cody" for the Fox dittos, "Ginger" for the
                                  # Falco specialist, "Master Player" for the twelve-character family).
                                  # It is part of the policy, not cosmetic.
console_delay = 0                 # OUR ENVIRONMENT HAS NO CONSOLE LAG (use_exi_inputs +
                                  # blocking_input + online_delay = 0), so the agent's full policy
                                  # delay applies: 21 frames for fox_d21_ditto_v4 and the twelve-
                                  # character family, 18 for fox_d18_*, 24 for fox_d24_ditto_v4.
                                  # console_delay exists to pay for a real console's lag; setting it
                                  # here would hand the agent an action timing it was never trained on.
                                  # OUR policy acts on the next frame, so every match in this file
                                  # against a Dropbox release is ASYMMETRIC IN OUR FAVOUR and the
                                  # report has to say so; only `fox_d0_tx_like_3x512` (delay 0, 22 Sep
                                  # 2026) is symmetric.
sample_temperature = 1.0          # the training distribution, as in [eval] and [video]
use_gpu = false                   # TensorFlow stays on the cores; the L4 belongs to our policy
jit_compile = false               # E010's proven setting (XLA off); their own evaluator defaults it on
async_inference = false           # the synchronous DelayedAgent: one step per frame, deterministic
verify_sha256 = true              # the staged file must be the release we measured
strict = true                     # an exception is a bug in OUR wiring: let it out.  Unlike SmashBot
                                  # there is no upstream "swallow it into a neutral input" behaviour to
                                  # reproduce -- their own evaluator would crash too.
[mimic]
source_dir = "/opt/mimic/source"          # the pinned checkout baked into the image
asset_dir = "/opt/mimic/fox-master"       # model.pt + config.json + the normalisation bundle
device = "cuda"
temperature = 1.0                 # the released defaults of integration_mimic_vs_hal.toml [mimic]
top_k = 0
top_p = 0.0
seed = 0
player = 1                        # overridden by the side order (--sides smashbot,mimic)

[video]
mode = "match"                    # one real match per Dolphin, first replay kept
matchups = ["policy:cpu9"]        # UNUSED by an external match; the sides come from --sides
clips = 16                        # 16 matches per checkpoint, all on Final Destination
seconds = 520.0                   # the per-match CAP, deliberately PAST Melee's 8-minute timer:
                                  # the rollout starts at frame -123 while the timer starts at 0, so a
                                  # 480 s budget stops 123 frames before a timed-out game writes its
                                  # GAME_END and the result would read as "unfinished".  The cap is
                                  # only a ceiling: match mode stops as soon as every Dolphin has
                                  # begun a second game.  (The 29 Aug 2026 jobs ran at 480.)
output_dir = "/runs/matches"
rollout_length = 128
temperature = 1.0                 # the training distribution, as in [eval]
seed = 0
port_offset = 0
wandb = false
