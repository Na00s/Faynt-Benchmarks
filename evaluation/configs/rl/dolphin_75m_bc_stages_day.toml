# The 75m six-stage self-play run (user request 4 Sep 2026: "similar experiment to what we ran for the 10m
# model, for the best 75m model from Ali"): the 10m recipe of launch 3 (`dolphin_10m_bc_stages_prefix_day.toml`
# -- 72 self-play + 24 cpu9 Dolphins on the six legal stages, D = 0, teacher KL 0.1, nb16, `context_mode =
# "prefix"` with the prefix teacher, three-hourly evals vs cpu9 / MIMIC / the BC anchor) on Ali's 75m family
# checkpoint, with the three things the model size forces and one lesson from P15:
#   * `[policy] profile = "75m"`: Ali's family profile (d_model 768, 11 layers, 12 heads, 3 kv heads, head_dim 64,
#     d_ff 1920; 75 305 709 parameters), absent from config.yaml on this branch -- `checkpoint.EXTRA_PROFILES`
#     fills it in and the loader still checks the checkpoint's summary and parameter count.
#   * `[learner] prefix_on_host = true`: one update stores 16 x 168 fp32 prefixes = 10.8 GiB at 75m (3.3 GiB at
#     10m); they stay in host RAM across the PPO epochs and each microbatch's slice rides to the L4 on demand.
#     The box gets 96 GiB instead of 64 (`modal_app` planned row -> `Function.with_options`).
#   * `[learner] microbatch_envs = 12` (the 10m: 24): the 75m's activations on the 24 GB L4.
#   * `[eval] metric_opponent = "mimic"`: P15 showed the anchor-selected `best.pt` was the weakest of three vs
#     MIMIC, so `best.pt` now follows the MIMIC eval (the `step_<n>.pt` ladder is the real record either way).
# The checkpoint: Ali's `family-pretraining-recovery-v1` launch `fpr-86ee3de26bceb87a48a6`, trial
# `75m-muon-low-b759246874c2`, `steps/step-86016.pt` = 5.64 B target frames (optimizer step 86 016 of a
# 25.0 B-frame cosine schedule, 24.6 h wall), muon_with_aux_adamw (muon lr 5e-3, aux 1e-3, wd 0.01), bf16
# training, context 256, action_offset_frames 1 (= our D = 0); staged at the STABLE path below.
# `dolphin_75m_bc_stages_smoke` (4 Sep 2026, W&B awlcl1qm) measured the shape: 565 s per PPO step at 348 fps
# (rollouts ~300 s of which policy_s 181 s, learner ~265 s), RAM peak 53.3 GiB with the prefixes on the host
# (hence the 96 GiB box), GPU 12.5 GB at microbatch 12, actor KL 7.8e-5 -> 2.7e-5 per update at lr 4e-5 (kept),
# actor_kl_pre ~1e-10 and teacher_kl 0 at unchanged weights (both prefix paths exact at 75m), 0 reverts, no
# WrongStage; the day file changes nothing but the burn-ins, the cap and the eval cadence.  Launch:
#   cd melee-policy-frisson-ai && .venv/bin/modal run --detach -e smash_melee_bot -m melee_rl.modal_app::train \
#       --config dolphin_75m_bc_stages_day --gpu --wide --wandb-mode online \
#       --checkpoint-subdir selfplay/75m_stages --spawn
# The user asked for ONE 48-hour launch (4 Sep 2026, "check if it will be interrupted or not"): Modal's client
# refuses a function timeout above 86400 s before anything runs (InvalidError, 06:37 UTC), so the run is 22-h
# launches of the same command -- launch 2+ resumes latest.pt, `max_total_runtime_s` stops it at 72 h, and each
# launch needs its own yes. Never two launches on one directory at once.  What to read: eval/mimic/* first, eval/other/* second (vs the BC start),
# loss/actor_kl_pre ~0, loss/teacher_kl without the 5e-3 floor, ppo/reverted ~0, weights/drift_step > 0,
# timing/learner_s and timing/step_s against the smoke, the container RAM (W&B system.memory_percent) < 96 GiB.
format = "melee_rl.rl_config.v1"

[runtime]
num_steps = 100000
max_runtime_s = 79200             # 22 h per launch: leaves ~2 h inside Modal's 24-h cap for boot, the end eval (~13 min warm at 75m), saves
max_total_runtime_s = 259200      # 72 h across launches (accumulated in loop_state.runtime_s; resumes count); each launch needs its own yes
seed = 0
deterministic = true
device = "cuda"
threads = 4
save_interval_steps = 2           # a step is 16 rollouts; 565 s at 75m (smoke: rollouts ~300 s, learner ~265 s) -> a save every ~19 min
snapshot_interval_steps = 8       # step_<n>.pt ladder: past selves for a later opponent pool

[policy]
profile = "75m"                   # Ali's family profile (d_model 768, 11 layers, 12 heads, 3 kv heads, d_ff 1920; 75 305 709 params):
                                  # absent from config.yaml on this branch, filled in by melee_rl.checkpoint.EXTRA_PROFILES
init = "checkpoint"
checkpoint = "/runs/bc/frisson-melee-75m.pt"   # the STABLE path (staged 4 Sep 2026, sha256 8662de0c...c648; never move it)
seed = 0                          # unused with init = "checkpoint"
compute_dtype = "float32"
cache_dtype = "float32"
fast_step = true                  # P7b: the vectorised ring step

[teacher]
source = "policy"                 # clone_frozen() of the just-loaded BC weights: no second file read

[env]
type = "dolphin"

[env.dolphin]
num_envs = 96                     # 72 self + 24 cpu9 (the mix groups must sum to this)
dolphin_path = "/opt/dolphin/mainline-exiai-14.1-noleak/squashfs-root/usr/bin/dolphin-emu"
iso_path = "/iso/melee.iso"
characters = [1, 1]               # libmelee internal ids: Fox vs Fox
costumes = [0, 1]
stage = 25                        # unused while `stages` is set (kept for the config's default path)
stages = [25, 24, 18, 26, 8, 6]   # FD, BF, PS, DL, FoD, YS -- cycled over the global env index: 16 each
slippi_port = 51441               # sliced per worker: worker w's env j listens on 51441 + 6w + j
console_timeout_s = 30.0
boot_timeout_s = 300.0            # 96 boots, 6 per worker, workers in parallel
keepalive_seconds = 0.0
step_threads = 0                  # per worker: one thread per Dolphin of its group (6)
boot = "two_phase"
worker_processes = 16             # split 12 + 4 across the arms (opponent.mix_workers)
mp_start_method = "spawn"
chunk_frames = 1                  # D = 0: the slack (b-1)+(k-1) <= D forces lockstep stepping

[actor]
rollout_length = 128
context_frames = 128              # still recorded: the value net reads the C + T window
delay_frames = 0                  # matches the model's action_offset_frames = 1 (no mismatch flag)
context_mode = "prefix"           # the rolling cache + its snapshot on the trajectory (patch #1)
batch_steps = 1                   # D = 0: no pipeline (P8 stays dormant by construction)
seed = 0

[actor.reward]
damage_ratio = 0.01
nana_ratio = 0.5
ledge_grab_penalty = 0.02
stalling_penalty = 0.1
stalling_threshold = 50.0
approaching_factor = 1e-3

[opponent]
type = "mix"                      # 85/15 self-play vs cpu9 by TRAINED ROWS (user decision 2 Sep 2026)
mix = ["self*72", "cpu9*24"]      # 72 self Dolphins = 144 rows (both ports) + 24 cpu9 rows: 86 % / 14 %
mix_workers = [12, 4]             # 6 Dolphins per worker in both arms; 72 and 24 are multiples of 6 stages
seed = 1

[learner]
learning_rate = 4e-5              # smoke-measured (4 Sep 2026, W&B awlcl1qm): actor KL 7.8e-5 on the first PPO step, then 2.65e-5 and
                                  # 2.71e-5 per update, clip 0.09-0.10, 0 reverts -- twice the 10m day run's settled 1.3e-5 at 1e-4, the same
                                  # clip band; a higher rate would leave the regime every good run had (S18 / S34)
kl_teacher_weight = 0.1           # slippi-ai's post-training recipe; the anti-collapse mechanism
value_burnin_steps = 6            # ~96 rollouts of value-only training (the BC recipe's 100 at nb = 1)
optimizer_burnin_steps = 3        # ~48 rollouts at lr 0: Adam's moments warm before the policy moves
microbatch_envs = 12              # must divide every arm's rows (144 and 24): 12 + 2 chunks per update; half the 10m's for the 75m activations
teacher_prefix = true             # the frozen teacher attends to the stored prefix too (no 5e-3 context floor)
prefix_on_host = true             # 16 x 168 fp32 75m prefixes = 10.8 GiB per update: they stay in host RAM, each microbatch's slice rides to the L4

[learner.returns]
reward_halflife = 4.0

[learner.ppo]
num_epochs = 2
num_batches = 16                  # slippi-ai's production regime: accumulate 16 rollouts per update
epsilon = 1e-2                    # the BC regime's measured clip window
beta = 0.0
max_mean_actor_kl = 5e-3          # ~185x the settled per-update KL (2.7e-5) and 64x the first-step transient (7.8e-5): the S21 rule

[delay]
allow_mismatch = false

[mimic]
source_dir = "/opt/mimic/source"          # the pinned checkout baked into the MIMIC image
asset_dir = "/opt/mimic/fox-master"       # model.pt + config.json + the normalisation bundle
device = "cuda"                   # MIMIC has no KV cache: it re-runs its 60-frame window every frame
temperature = 1.0                 # the released defaults of integration_mimic_vs_hal.toml [mimic]
top_k = 0
top_p = 0.0
seed = 0
player = 1                        # environment player 1 = Dolphin port 2, as in Ali's launcher

[logging]
mode = "disabled"                 # the launch passes --wandb-mode online (secret: smash-melee-wandb-secret)
entity = "frisson-labs"
project = "Faynt"
group = "rl-post-training"
job_type = "rl"
tags = [
    "ppo", "dolphin-env", "self-play", "two-port", "bc-init", "teacher-kl", "75m", "l4", "day",
    "wide", "prefix", "teacher-prefix", "host-prefix", "mb12", "xwide", "mp-workers", "fast-step", "nb16", "stages",
    "mimic-eval", "mix", "cpu9-arm", "self85",
]
print_interval_steps = 1

[eval]
enabled = true
interval_seconds = 10800.0        # three-hourly, as the 10m; the 75m smoke's cold start round took 707 s (cpu9 171 / MIMIC 67 / anchor 65 fps)
at_start = true                   # skipped on a resume; the first round is cold (MIMIC model load + CUDA warm-up)
at_end = true
frames = 46080                    # per opponent: 30 eval Dolphins x 1536 frames (25.6 s of game each)
num_envs = 30                     # 5 per stage: every stage is covered in every round
worker_processes = 10             # the eval Dolphins' own layout (3 per worker; 30 does not divide by the 16 training workers)
rollout_length = 128
# The zero-noise anchor is the BC init itself: eval/other reads ~0 at step 0 and cannot cycle.
# MIMIC (the released fox-master model through its own inference code, P12) is the outside yardstick.
opponents = ["cpu9", "mimic", "other:/runs/bc/frisson-melee-75m.pt"]
temperature = 1.0
seed = 0
metric = "reward_per_frame"
metric_opponent = "mimic"         # best.pt selects on the MIMIC eval: the anchor metric picked the weakest 10m checkpoint vs MIMIC (P15)
