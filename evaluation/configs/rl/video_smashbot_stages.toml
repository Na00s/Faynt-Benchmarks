# P25 (9 Sep 2026): 18 REAL four-stock matches against altf4/SmashBot across the SIX legal stages.
#
# SmashBot (GPL-3.0, revision 67c4120) is a hand-written expert system -- Strategies over Tactics over
# Chains -- and the strongest public Melee agent that is not a neural network.  It is the opponent the
# claim "best Melee bot" has to survive; MIMIC and CPU 9 only test "best learned Fox".
#
# The recorder and the wire are MIMIC's (`melee_rl.smashbot`, port 2, its own decision code through
# `esagent.ESAgent.act`); the difference is `[smashbot]`.  RUN THE CALIBRATION ARMS FIRST
# (`smashbot_cpu9.toml`, `smashbot_mimic.toml`): SmashBot's libmelee drift fails silently and upstream
# swallows its exceptions, so a broken SmashBot plays like a passive Fox rather than crashing.  No
# number from this file means anything until that gate has passed.
#
#   .venv/bin/modal run --detach -e smash_melee_bot -m melee_rl.modal_app::video --smashbot \
#       --config video_smashbot_stages --checkpoint /runs/shared/p21-best/frisson-melee-10m-rl-step1318.pt \
#       --output-dir /runs/matches/p25-smashbot --label 10m-rl-1318-vs-smashbot-stages --spawn
#
# Budget: SmashBot costs a few hundred microseconds of Python per Dolphin-frame, so a job is bounded by
# the Dolphins and our own policy, not by the opponent -- unlike MIMIC, which re-runs a 60-frame window
# every frame.  Expect a job to be quicker than the matching `video_mimic_stages` one.

format = "melee_rl.rl_config.v1"

[runtime]
num_steps = 0                     # nothing trains in a recording job
seed = 0
deterministic = true
device = "cuda"                   # our checkpoint is on the L4; SmashBot is pure Python on the cores
threads = 8

[policy]
profile = "10m"                   # only a fallback; the recorded checkpoint carries its own config
init = "random"
seed = 0
compute_dtype = "float32"
cache_dtype = "float32"
fast_step = true                  # P7b: the vectorised ring step

[teacher]
source = "none"

[env]
type = "dolphin"

[env.dolphin]
num_envs = 18                     # one Dolphin per match, three per stage (VideoConfig.clips overrides it)
dolphin_path = "/opt/dolphin/mainline-exiai-14.1-noleak/squashfs-root/usr/bin/dolphin-emu"
iso_path = "/iso/melee.iso"
characters = [1, 1]               # Fox vs Fox, as in Ali's benchmark launcher
costumes = [0, 1]
stage = 25                        # unused while `stages` is set (the config's default path)
stages = [25, 24, 18, 26, 8, 6]   # FD, BF, PS, DL, FoD, YS -- cycled over the env index: 3 each of 18
slippi_port = 51441
console_timeout_s = 30.0
boot_timeout_s = 300.0
keepalive_seconds = 0.0
step_threads = 0
boot = "two_phase"
worker_processes = 0              # REQUIRED: SmashBot reads the raw gamestates, which only exist here
chunk_frames = 1
save_replays = true
infinite_time = false             # a REAL match -- stocks fall and the game ends
stop_timeout_s = 20.0             # SIGTERM Dolphin before Console.stop kills it (ENV.md §6.5)

[actor]
rollout_length = 128
context_frames = 0                # ring mode: no history window (the deployment path)
delay_frames = 0                  # matches action_offset_frames = 1 of the recorded checkpoints
context_mode = "ring"
batch_steps = 1
seed = 0

[actor.reward]
damage_ratio = 0.01
nana_ratio = 0.5
ledge_grab_penalty = 0.02
stalling_penalty = 0.1
stalling_threshold = 50.0
approaching_factor = 1e-3

[opponent]
type = "cpu"                      # only fixes the default player layout; the recorder builds MIMIC

[learner]
kl_teacher_weight = 0.0           # nothing trains here; without a teacher the weights must be zero
reverse_kl_teacher_weight = 0.0

[delay]
allow_mismatch = false

[logging]
mode = "disabled"                 # a recording job logs nothing

[eval]
at_start = false
at_end = false

[smashbot]
source_dir = "/opt/smashbot/source"       # the pinned GPL-3.0 checkout baked into the image
player = 1                        # environment player 1 = Dolphin port 2, as MIMIC is
seed = 0                          # SmashBot draws from the global `random`; this seeds its private stream
delay_frames = 0                  # SET FROM THE CALIBRATION SWEEP (`smashbot_cpu9.toml`): our env runs
                                  # use_exi_inputs + blocking_input + online_delay = 0, so an opponent
                                  # decides on frame N and its input lands on frame N -- tighter than the
                                  # named-pipe path SmashBot was written against.  A chain that presses a
                                  # frame early to absorb that latency then lands a frame early, which is
                                  # what a missed ledgedash or Firefox looks like.
compat = true                      # the libmelee shim (melee_rl.smashbot_compat).  The
                                  # calibration A/B turns it off with
                                  # --overrides "smashbot.compat=false" to MEASURE what the
                                  # 0.41 -> 0.47 drift costs, rather than assert it.
strict = false                    # CAMPAIGN setting, deliberately the opposite of the calibration
                                  # files.  `strict = true` exists to catch OUR integration bugs and it
                                  # earned its keep (it found three).  But SmashBot has bugs of its own
                                  # -- `Chains/boardsideplatform.py:33` uses `platform_left` without the
                                  # `is not None` guard it applied two lines earlier, so entering that
                                  # chain on a stage with no side platforms (FD, PS) raises -- and
                                  # upstream `smashbot.py` swallows exactly that into a neutral input.
                                  # Running the campaign strict would measure a SmashBot nobody else has;
                                  # running it lenient measures the real one.  The exception count and
                                  # the neutral-frame share are reported per arm either way.

[video]
mode = "match"                    # one real match per Dolphin, first replay kept
matchups = ["policy:smashbot"]
clips = 18                        # 18 matches per checkpoint: three per stage
seconds = 520.0                   # the per-match CAP, deliberately PAST Melee's 8-minute timer:
                                  # the rollout starts at frame -123 while the timer starts at 0, so a
                                  # 480 s budget stops 123 frames before a timed-out game writes its
                                  # GAME_END and the result would read as "unfinished".  The cap is
                                  # only a ceiling: match mode stops as soon as every Dolphin has
                                  # begun a second game.  (The 29 Aug 2026 jobs ran at 480.)
output_dir = "/runs/matches"
rollout_length = 128
temperature = 1.0                 # the training distribution, as in [eval]
seed = 0
port_offset = 0
wandb = false

[video.render]
# Copied from `video_match_stages.toml`: without this block the recorder's render stage falls back
# to RenderConfig defaults, which do not point at the Ishiiruka PLAYBACK build, and
# `modal_app::render --config video_smashbot` silently renders nothing (measured 9 Sep 2026:
# two render jobs completed and produced zero mp4s).
# The Slippi PLAYBACK build, pinned into the video image only (26 Aug 2026 probe): the ExiAI Dolphin
# we train with has no -i and no ffmpeg, both netplay builds reject -i, and this is the one binary
# that accepted the comm file and actually wrote frames.  It needs an X server and does not exit when
# the replay ends, so the call is bounded by the clip length x speed_factor and ffmpeg trims the dump.
dolphin_path = "/opt/dolphin/ishiiruka-playback-3.5.2/squashfs-root/usr/bin/dolphin-emu"
iso_path = "/iso/melee.iso"
backend = "OGL"
platform = ""                     # wx build: no --platform flag (Xvfb supplies the display)
xvfb = true
internal_resolution = 1           # 1x native 640 x 480 -> GFX.ini EFBScale = SCALE_1X (P9b: Ishiiruka
                                  # has no InternalResolution key, and its Linux default is SCALE_2X,
                                  # so before the fix every render rasterised 1280 x 960)
bitrate_kbps = 3000
dump_format = "avi"
emulation_speed = 0.0
caption = true                    # "<checkpoint> step N (P1) vs CPU 9 (P2) - clip 1/2", burned in
font_size = 18
crf = 26                          # x264 quality of the caption pass. 20 gave ~4.7 Mbit/s at
                                  # 642 x 528 (~71 MB per 2-min clip); 26 is visually close at
                                  # this size and about a third of the bytes, which matters when
                                  # a ten-clip job gets passed around a team.
timeout_s = 1800.0                # the hard cap per render call
speed_factor = 20.0               # only a safety net now: --cout frame markers end each render as
min_timeout_s = 120.0             # soon as the replay does (render.run_playback)
workers = 6                       # eight concurrent renders measured the wall clock of one, so the
                                  # six fresh clips of a job are a single batch
