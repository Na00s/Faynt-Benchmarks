# The 25-minute shake-out for the matched-batch regime (user decisions 25 Aug 2026): num_batches = 16
# (slippi-ai's production recipe -- scripts/rl_example.sh:32, jax/rl/scripts/launch_rl.py:49) and
# 96 Dolphins on the same wide box, at D = 5 with the b2k4 pipeline.  **Its job is to measure**
# (1) the median loss/actor_kl_mean per 16-rollout update at lr 2e-4 -- the lr-to-KL relation has
# failed on all three previous regime changes -- and (2) the 96-env throughput (CPU was 54 % busy at
# 64 envs; RAM 31.6/64 GiB; GPU 6.7/23 GiB).  Set the day file's lr from the reading, then relaunch.
# Burn-ins 1/1 so PPO steps arrive quickly; eval off; ~30 min on the wide function (~$1.4).
#   .venv/bin/modal run --detach -e smash_melee_bot -m melee_rl.modal_app::train \
#       --config dolphin_5m_delay_nb16_smoke --gpu --wide --wandb-mode online \
#       --checkpoint-subdir p8/nb16_smoke --spawn
# allow_mismatch: random init at D = 5 is in-distribution by construction (P8-PLAN.md preamble).
format = "melee_rl.rl_config.v1"

[runtime]
num_steps = 100000
max_runtime_s = 1800              # 30 min: boots + 2 burn-in steps + ~7 PPO steps at ~2.5 min each
seed = 0
deterministic = true
device = "cuda"
threads = 4
save_interval_steps = 2
snapshot_interval_steps = 0

[policy]
profile = "5m"                    # config.yaml: d_model 256, 3 layers, 5.05 M
init = "random"                   # from scratch: no delayed BC checkpoint exists yet (q12)
seed = 0
compute_dtype = "float32"
cache_dtype = "float32"
fast_step = true                  # P7b: the vectorised ring step

[teacher]
source = "none"                   # from scratch: nothing sensible to anchor to (PLAN.md §9.4)

[env]
type = "dolphin"

[env.dolphin]
num_envs = 96                     # 6 per worker; players is derived from opponent.type
dolphin_path = "/opt/dolphin/mainline-exiai-14.1-noleak/squashfs-root/usr/bin/dolphin-emu"
iso_path = "/iso/melee.iso"
characters = [1, 1]               # libmelee internal ids: Fox vs Fox
costumes = [0, 1]
stage = 25                        # Final Destination (libmelee id)
slippi_port = 51441               # sliced per worker: worker w's env j listens on 51441 + 6w + j
console_timeout_s = 30.0
boot_timeout_s = 300.0            # 96 boots, 6 per worker, workers in parallel
keepalive_seconds = 0.0
step_threads = 0                  # per worker: one thread per Dolphin of its group (6)
boot = "two_phase"
worker_processes = 16             # the P7 layout (groups of 4)
mp_start_method = "spawn"
chunk_frames = 4                  # k = 4: the winning bench point (runahead r = D - (b - 1) = 4)

[actor]
rollout_length = 128
context_frames = 128
delay_frames = 5                  # D = 5 (Ali's q12 target: data.delay 6 <=> delay_frames 5)
context_mode = "ring"
batch_steps = 2                   # b = 2: the winning bench point (b | T = 128)
seed = 0

[actor.reward]
damage_ratio = 0.01
nana_ratio = 0.5
ledge_grab_penalty = 0.02
stalling_penalty = 0.1
stalling_threshold = 50.0
approaching_factor = 1e-3

[opponent]
type = "self"
train = true                      # both ports are the student: 2 x 96 = 192 rows
seed = 1

[learner]
learning_rate = 2e-4              # measured twice: the D = 0 5m smoke (median actor KL 3.08e-3) and
                                  # the P8 b2k4 bench (3.04e-3 at D = 5, 0/47 reverts) agree
kl_teacher_weight = 0.0
value_burnin_steps = 1            # the smoke only needs PPO steps quickly; the day file uses 4/3
optimizer_burnin_steps = 1

[learner.returns]
reward_halflife = 4.0

[learner.ppo]
num_epochs = 2
num_batches = 16                  # slippi-ai's production regime: accumulate 16 rollouts per update
epsilon = 0.1                     # the from-scratch clip window (session 13 take two)
beta = 0.0
max_mean_actor_kl = 2e-2          # a backstop, not the throttle

[delay]
allow_mismatch = true             # random init: the flag only acknowledges the declared offset (header)

[logging]
mode = "disabled"                 # the launch passes --wandb-mode online (secret: smash-melee-wandb-secret)
entity = "frisson-labs"
project = "Faynt"
group = "rl-post-training"
job_type = "rl"
tags = [
    "ppo", "dolphin-env", "self-play", "two-port", "from-scratch", "5m", "l4", "smoke", "wide",
    "ring", "mp-workers", "fast-step", "p8", "delay-pipeline", "nb16",
]
print_interval_steps = 1

[eval]
enabled = false                   # a measurement run: no eval boots
