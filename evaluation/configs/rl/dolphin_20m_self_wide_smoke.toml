# Session 13 (23 Aug 2026): the 20-minute shake-out for dolphin_20m_self_wide_day.toml -- same 64 Dolphins
# x 2 ports = 128 learner rows on the L4 + 32 cores / 64 GiB, but with the burn-in ladders cut to 3 steps
# each and a token evaluation, so a launch reaches the real PPO stage (and therefore the real GPU-memory
# peak: 128 rows microbatched to 64, never run before -- the one-port wide run measured 14.0 GB) within
# minutes instead of the 83 minutes the day file spends in burn-in.  What it proves: 64 two-port Dolphins
# boot, the two-port rollout and the microbatched learner pass fit the L4, the three-opponent evaluation
# works including loading the frozen anchor from the volume, and the first post-burn-in actor KL at
# lr 3e-4 is inside the 1e-2 guard (ppo/reverted 0).  About $0.94 for 20 minutes (estimate + yes).
#   .venv/bin/modal run -e smash_melee_bot -m melee_rl.modal_app::train \
#       --config dolphin_20m_self_wide_smoke --gpu --wide --wandb-mode online \
#       --checkpoint-subdir selfplay/20m_smoke
format = "melee_rl.rl_config.v1"

[runtime]
num_steps = 10000                 # the wall-time limit below ends the run
max_runtime_s = 1200              # 20 minutes: boots (~1 min) + burn-in + a handful of real PPO steps
seed = 0
deterministic = true
device = "cuda"
threads = 4
save_interval_steps = 5
snapshot_interval_steps = 0

[policy]
profile = "20m"                   # Ali's active profile (config.yaml): d_model 512, 6 layers, 20.04 M
init = "random"
seed = 0
compute_dtype = "float32"
cache_dtype = "float32"

[teacher]
source = "none"                   # from scratch: nothing sensible to anchor to (PLAN.md §9.4)

[env]
type = "dolphin"

[env.dolphin]
num_envs = 64                     # players is derived from opponent.type: ("policy", "policy") for self-play
dolphin_path = "/opt/dolphin/mainline-exiai-14.1-noleak/squashfs-root/usr/bin/dolphin-emu"
iso_path = "/iso/melee.iso"
characters = [1, 1]               # libmelee internal ids: Fox vs Fox
costumes = [0, 1]
stage = 25                        # Final Destination (libmelee id)
slippi_port = 51441               # env i listens on 51441 + i; the eval Dolphins start 8 ports later
console_timeout_s = 30.0
boot_timeout_s = 300.0            # 64 two-phase boots on 32 cores (8 took ~29 s)
keepalive_seconds = 0.0
step_threads = 0                  # one thread per Dolphin for send + advance + convert
boot = "two_phase"

[actor]
rollout_length = 128
context_frames = 128
delay_frames = 0
context_mode = "ring"             # no re-prime; learner-side behaviour log-probs (PLAN.md §3.6 deviation 2)
seed = 0

[actor.reward]
damage_ratio = 0.01
nana_ratio = 0.5
ledge_grab_penalty = 0.02
stalling_penalty = 0.1
stalling_threshold = 50.0
approaching_factor = 1e-3

[opponent]
type = "self"
train = true                      # both ports are the student: no opponent object, 2 x 64 = 128 rows
seed = 1

[learner]
learning_rate = 3e-4              # ~100x the movement per update of the flat run; the 1e-2 guard now binds
kl_teacher_weight = 0.0
value_burnin_steps = 3            # the day file uses 50; 3 is enough to reach the PPO stage here
optimizer_burnin_steps = 3        # the day file uses 50 (Adam's moments need the longer warm-up)
microbatch_envs = 64              # 128 rows in one learner pass would not fit the L4 (64 rows measured 14 GB)

[learner.returns]
reward_halflife = 4.0

[learner.ppo]
num_epochs = 2
num_batches = 1
epsilon = 0.05                    # at lr 3e-4 typical |log rho| ~ 0.08: at 1e-2 the 2nd epoch is all clipped
beta = 0.0                        # slippi-ai's default; 0.3 was extra damping on an already tiny step
max_mean_actor_kl = 1e-2          # the real trust region: anything worse reverts params + optimizer state

[delay]
allow_mismatch = false

[logging]
mode = "disabled"                 # the launch passes --wandb-mode online (secret: smash-melee-wandb-secret)
entity = "frisson-labs"
project = "Faynt"
group = "rl-post-training"
job_type = "rl"
tags = ["ppo", "dolphin-env", "self-play", "two-port", "from-scratch", "20m", "l4", "smoke", "wide", "ring"]
print_interval_steps = 1

[eval]
enabled = true
interval_seconds = 3600.0         # hourly, checked after the current step; plus the start and end of a launch
at_start = true
at_end = true
frames = 8192                     # two rollouts per opponent: enough to prove the path, ~1 min each
num_envs = 32
rollout_length = 128
# The fixed references: the CPU ladder at both ends and a frozen 20m random init (the previous run's own
# step 0, on the volume).  "best" is deliberately absent -- it moves with the run and can cycle, so it
# cannot tell real progress from rock-paper-scissors; best.pt is still written by the selector below.
opponents = ["cpu1", "cpu9", "other:/runs/p6b/20m_day/step_00000000.pt"]
temperature = 1.0
seed = 0
metric = "reward_per_frame"       # the composite the learner actually optimises, against the weakest CPU
metric_opponent = "cpu1"
